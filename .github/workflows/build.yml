# Builds installable artifacts only on demand or for a version tag (v1.0.0),
# so everyday pushes cost no Actions minutes.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Android APK
        run: flutter build apk --release --dart-define=SIMULATE_PURCHASES=true
      - name: Web
        run: flutter build web --release --no-web-resources-cdn --base-href /
      - uses: actions/upload-artifact@v4
        with:
          name: kleine-pause-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: kleine-pause-web
          path: build/web
          retention-days: 14
