# Starts the release APK on an Android emulator. Runs only when Android
# config or the app start changes, or on demand, to keep minutes low.
name: Android start

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'lib/main.dart'
      - 'pubspec.yaml'
      - '.github/scripts/android_smoke.sh'
      - '.github/workflows/android-smoke.yml'

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=SIMULATE_PURCHASES=true
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-start
          path: smoke/
          retention-days: 7
